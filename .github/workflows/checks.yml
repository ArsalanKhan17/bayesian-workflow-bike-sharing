name: Check evidence and render book
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -el {0}
env:
  BAYES_SKIP_RENV: '1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-linux-64.lock
          environment-name: bayes-workflow
          cache-environment: true
      - name: Verify locked R package versions
        run: Rscript scripts/check-environment.R
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Test statistical and data contracts
        run: Rscript scripts/test.R
      - name: Validate committed evidence
        run: Rscript scripts/validate.R --strict
      - name: Render executed book
        run: quarto render book
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-book
          path: book/_book

