name: Check evidence and render book
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - name: Install igraph system dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglpk40
      - uses: r-lib/actions/setup-renv@v2
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Test statistical and data contracts
        run: Rscript scripts/test.R
      - name: Validate committed evidence
        run: Rscript scripts/validate.R --strict
      - name: Render executed book
        run: quarto render book
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-book
          path: book/_book

